apiVersion: batch/v1
kind: CronJob
metadata:
  name: nintendo-ticket-checker
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
            - name: ticket-checker
              image: nintendo-ticket-checker:latest
              imagePullPolicy: Never
              command: ["node", "dist/index.js", "--once"]
              envFrom:
                - configMapRef:
                    name: nintendo-ticket-checker-env
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "250m"
          restartPolicy: OnFailure
